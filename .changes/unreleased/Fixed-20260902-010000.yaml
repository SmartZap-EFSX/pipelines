kind: 'Fixed'
body: 'made reusable GitHub workflows safe for immutable consumer execution while retaining their current defaults: `go.yaml` and `yarn.yaml` now expose a `changelog_check` switch that continues to require changelog entries unless a consumer explicitly disables it, and Yarn forwards its configured `node_version` to Knip instead of silently running that job on Node 20. A repository can therefore pin the reusable workflow at one revision, opt out of the initial changelog gate during adoption, and run every JavaScript check on the same Node release it selected. The SmartZap fork also no longer invokes the repository-level Claude review caller, whose app is not installed in the organization; CodeRabbit remains the configured review authority while the reusable Claude workflow stays available for opted-in consumers.'
time: '2026-09-02T01:00:00Z'
